version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: salon_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: salon_booking

  backend:
    build: ./backend
    container_name: salon_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=salon_booking
      - SECRET_KEY=your-production-secret-key-change-this
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: salon_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
